[package]
name = "omniverse-math"
version = "0.1.0"
edition = "2021"

[dependencies]
stylus-sdk = "0.10.4"

[dev-dependencies]

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]
contract-client-gen = []

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
