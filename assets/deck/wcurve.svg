<svg width="1000" height="520" viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/><stop offset="0.5" stop-color="#10B981"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="60" x2="0" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.28"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <!-- axes -->
  <line x1="70" y1="430" x2="950" y2="430" stroke="#2A2A30" stroke-width="2"/>
  <line x1="70" y1="60" x2="70" y2="430" stroke="#2A2A30" stroke-width="2"/>
  <!-- W-curve: lambda*(P) -> low at extremes, peaks at ~0.16/0.84, dip at 0.5 -->
  <path id="w" d="M 70 410 C 150 405 200 110 290 95 C 380 80 430 250 510 252 C 590 250 640 80 730 95 C 820 110 870 405 950 410"
        fill="none" stroke="#10B981" stroke-opacity="0.5" stroke-width="16" filter="url(#soft)"/>
  <path d="M 70 410 C 150 405 200 110 290 95 C 380 80 430 250 510 252 C 590 250 640 80 730 95 C 820 110 870 405 950 410 L 950 430 L 70 430 Z"
        fill="url(#fill)"/>
  <path d="M 70 410 C 150 405 200 110 290 95 C 380 80 430 250 510 252 C 590 250 640 80 730 95 C 820 110 870 405 950 410"
        fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
  <!-- collapse tails (P->0, P->1) in crimson -->
  <circle cx="70" cy="410" r="11" fill="#EF4444"/>
  <circle cx="950" cy="410" r="11" fill="#EF4444"/>
  <!-- peak markers -->
  <circle cx="290" cy="95" r="9" fill="#34D399"/>
  <circle cx="730" cy="95" r="9" fill="#34D399"/>
  <!-- labels -->
  <text x="62" y="470" fill="#8B8D98" font-family="Arial, sans-serif" font-size="26">P=0</text>
  <text x="486" y="470" fill="#8B8D98" font-family="Arial, sans-serif" font-size="26">0.5</text>
  <text x="918" y="470" fill="#8B8D98" font-family="Arial, sans-serif" font-size="26">P=1</text>
  <text x="20" y="80" fill="#8B8D98" font-family="Arial, sans-serif" font-size="26">λ*</text>
</svg>
