"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Meta {
  status: JSON
}

type Query {
  market(id: String!): market
  markets(where: marketFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): marketPage!
  trade(id: String!): trade
  trades(where: tradeFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): tradePage!
  priceSnapshot(id: String!): priceSnapshot
  priceSnapshots(where: priceSnapshotFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): priceSnapshotPage!
  rebalance(id: String!): rebalance
  rebalances(where: rebalanceFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): rebalancePage!
  liquidityEvent(id: String!): liquidityEvent
  liquidityEvents(where: liquidityEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): liquidityEventPage!
  lendingAction(id: String!): lendingAction
  lendingActions(where: lendingActionFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): lendingActionPage!
  _meta: Meta
}

